<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--nav:#162032;--n2:#1e2d45;--ac:#0d9488;--bg:#f3f5f8;--sf:#fff;--bd:#e5e7eb;--tx:#1e293b;--t2:#64748b;--t3:#94a3b8;--tl:#0d9488;--tll:#ccfbf1;--am:#f59e0b;--aml:#fef3c7;--rd:#ef4444;--rdl:#fee2e2;--gn:#16a34a;--gnl:#dcfce7;--bl:#3b82f6;--bll:#dbeafe}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh;font-size:11px}
.sb{width:200px;background:var(--nav);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;z-index:10;overflow-y:auto}
.sb-br{padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}.sb-br h2{color:#fff;font-size:13px}.sb-br span{color:var(--tl);font-size:9px;font-weight:600;letter-spacing:.06em;display:block;margin-top:2px}
.sb-nav{flex:1;padding:8px 6px;display:flex;flex-direction:column;gap:1px}
.ni{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:5px;color:rgba(255,255,255,.6);font-size:11px;font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.ni:hover{background:var(--n2);color:rgba(255,255,255,.9)}.ni.on{background:var(--ac);color:#fff}
.ni .ic{width:16px;text-align:center;font-size:13px;flex-shrink:0}.ni .bd{margin-left:auto;background:var(--am);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px}
.sb-ft{padding:8px 12px;border-top:1px solid rgba(255,255,255,.08)}.sb-ft label{color:rgba(255,255,255,.5);font-size:10px;display:flex;align-items:center;gap:5px;cursor:pointer}
.mn{margin-left:200px;flex:1}.tb{background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
.tb h1{font-size:13px;font-weight:700}.tb .sub{font-size:10px;color:var(--t3);margin-left:4px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.up{display:flex;align-items:center;gap:5px;padding:4px 8px;background:var(--bg);border-radius:12px;font-size:10px;font-weight:600;color:var(--t2)}.ud{width:6px;height:6px;border-radius:50%;background:var(--gn)}
.ct{padding:12px 16px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.sc{background:var(--sf);border-radius:7px;padding:8px 10px;border:1px solid var(--bd)}.sc .lb{font-size:9px;color:var(--t2);margin-bottom:2px}.sc .vl{font-size:18px;font-weight:700}.sc .sv{font-size:8px;font-weight:600;margin-top:1px}
.sc-click{cursor:pointer}.sc-click:hover{border-color:var(--tl)}
.sr2{display:flex;gap:8px;margin-bottom:12px}
.slc{flex:1;background:var(--sf);border-radius:7px;padding:10px;border:1px solid var(--bd);text-align:center}.slc .sl{font-size:9px;color:var(--t2);margin-bottom:3px}.slp{font-size:16px;font-weight:700}.slt{font-size:8px;color:var(--t3)}
.cd{background:var(--sf);border-radius:7px;border:1px solid var(--bd);overflow:hidden;margin-bottom:12px}
.ch2{padding:6px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}.ch2 h3{font-size:11px;font-weight:700;flex:1}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{padding:5px 7px;text-align:left;font-size:9px;font-weight:600;color:var(--t3);background:#fafbfc;border-bottom:1px solid var(--bd);white-space:nowrap;text-transform:uppercase}
tbody td{padding:5px 7px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tbody tr:hover{background:#f8fafb}.clickrow{cursor:pointer}
.bs{padding:1px 5px;border-radius:8px;font-size:9px;font-weight:600;white-space:nowrap;display:inline-block}
.b-new,.b-reported{background:var(--bll);color:#1d4ed8}.b-relayed,.b-in_progress,.b-open,.b-monitoring,.b-ready,.b-on_hold,.b-en_route{background:var(--aml);color:#92400e}.b-on_site{background:#fae8ff;color:#a21caf}.b-done,.b-completed,.b-closed,.b-resolved,.b-arrived{background:var(--gnl);color:var(--gn)}.b-transferred,.b-noted,.b-assessed,.b-escalated{background:#e0e7ff;color:#4338ca}.b-active,.b-guest{background:var(--tll);color:var(--tl)}.b-pending,.b-scheduled{background:#f5f3ff;color:#6d28d9}.b-overdue,.b-high,.b-urgent{background:var(--rdl);color:var(--rd)}.b-staff_request{background:#e0e7ff;color:#4338ca}.b-queued{background:var(--bll);color:#1d4ed8}.b-low{background:var(--gnl);color:var(--gn)}.b-medium{background:var(--aml);color:#92400e}
.btn{padding:4px 8px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:inherit}.bp{background:var(--tl);color:#fff}.bp:hover{background:#0f766e}.bo{background:transparent;border:1.5px solid var(--bd);color:var(--t2)}
.ab{font-size:9px;padding:2px 5px;border:none;border-radius:4px;cursor:pointer;font-weight:600;font-family:inherit;margin-right:1px}
.a-relay{background:var(--aml);color:#92400e}.a-onsite{background:#fae8ff;color:#a21caf}.a-done{background:var(--gnl);color:var(--gn)}.a-undo{background:var(--rdl);color:var(--rd)}.a-note,.a-assess{background:#e0e7ff;color:#4338ca}.a-transfer{background:#dbeafe;color:#1d4ed8}.a-edit{background:var(--bg);color:var(--t2)}
.tabs{display:flex;gap:2px;background:var(--sf);border-radius:5px;padding:2px;border:1px solid var(--bd);width:fit-content;flex-wrap:wrap;margin-bottom:8px}

function saveWOAssess(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;var text=$('a-text')&&$('a-text').value;if(!text)return toast('Assessment required');w.assessment=text;w.assign_type=$('a-type')?$('a-type').value:'inhouse';if(w.assign_type==='outsource'){w.contractor=$('a-con')?$('a-con').value:'';w.as=''}else{w.as=$('a-staff')?$('a-staff').value:'';w.contractor=''}w.assessed_by=$('a-by')?$('a-by').value:'';w.assessed_at=now().toISOString();w.target_start=$('a-ts')?$('a-ts').value:'';w.target_end=$('a-te')?$('a-te').value:'';var ec=$('a-ec')&&$('a-ec').value;w.est_cost=ec?parseFloat(ec):null;w.st='assessed';woA(w,'Assessed',w.assessed_by);sv();closeMs();toast('Assessed');R();openWODet(id)}
function openWOUpdate(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;var ppl=[].concat(DS[w.dept]||[],HD).filter(function(v,i,a){return a.indexOf(v)===i});openModal('<div class="mh"><h3>Update '+w.no+'</h3><button class="mx" onclick="closeMs()">×</button></div><div class="mb2"><div class="fg"><div class="ff fw"><label>Progress update</label><textarea id="u-text" rows="3"></textarea></div><div class="ff"><label>By</label><select id="u-by">'+ppl.map(function(s){return'<option>'+s+'</option>'}).join('')+'</select></div></div><div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--bd)"><label style="font-size:10px;display:flex;align-items:center;gap:5px;color:var(--t2);cursor:pointer;margin-bottom:6px"><input type="checkbox" id="u-extend" onchange="document.getElementById(\'u-ext-wrap\').style.display=this.checked?\'block\':\'none\'"> Extend deadline</label><div id="u-ext-wrap" style="display:none;margin-bottom:8px"><div class="fg"><div class="ff"><label>Current</label><input value="'+(w.target_end||w.requested_date||'—')+'" readonly style="background:#f5f5f5;color:var(--t2)"></div><div class="ff"><label>New deadline</label><input type="date" id="u-newdate"></div><div class="ff fw"><label>Reason</label><input id="u-extreason" placeholder="Parts delayed…"></div></div></div>'+(w.assign_type!=='outsource'?'<label style="font-size:10px;display:flex;align-items:center;gap:5px;color:var(--t2);cursor:pointer"><input type="checkbox" id="u-outsource" onchange="document.getElementById(\'u-con-wrap\').style.display=this.checked?\'block\':\'none\'"> Transfer to Outsource</label><div id="u-con-wrap" style="display:none;margin-top:6px"><div class="fg"><div class="ff"><label>Contractor</label><input id="u-con"></div><div class="ff"><label>Est. cost (₱)</label><input type="number" id="u-cost"></div></div></div>':'')+'</div></div><div class="mf"><button class="btn bo" onclick="closeMs()">Cancel</button><button class="btn bp" onclick="saveWOUpdate('+id+')">Save</button></div>')}
function saveWOUpdate(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;var text=$('u-text')&&$('u-text').value;if(!text)return toast('Required');var by=$('u-by')?$('u-by').value:'';w.updates.push({text:text,by:by,at:now().toISOString()});woA(w,'Progress update',by);if($('u-extend')&&$('u-extend').checked){var nd=$('u-newdate')&&$('u-newdate').value;if(!nd)return toast('New deadline required');var reason=$('u-extreason')?$('u-extreason').value:'';var old=w.target_end||w.requested_date||'—';w.target_end=nd;w.updates.push({text:'📅 Deadline: '+old+' → '+nd+(reason?' — '+reason:''),by:by,at:now().toISOString()});woA(w,'Deadline extended: '+old+' → '+nd,by)}if($('u-outsource')&&$('u-outsource').checked){var con=$('u-con')&&$('u-con').value;if(!con)return toast('Contractor required');w.assign_type='outsource';w.contractor=con;w.as='';var cost=$('u-cost')&&$('u-cost').value;if(cost)w.est_cost=parseFloat(cost);w.updates.push({text:'→ Outsourced: '+con,by:by,at:now().toISOString()});woA(w,'Outsourced: '+con,by)}sv();closeMs();toast('Updated');R();openWODet(id)}
function openWOComplete(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;openModal('<div class="mh"><h3>Complete '+w.no+'</h3><button class="mx" onclick="closeMs()">×</button></div><div class="mb2"><div class="fg"><div class="ff fw"><label>Completion notes</label><textarea id="c-text" rows="2"></textarea></div><div class="ff"><label>Actual cost (₱)</label><input type="number" id="c-cost" value="'+(w.est_cost||'')+'"></div><div class="ff"><label>By</label><select id="c-by">'+(DS[w.dept]||[]).map(function(s){return'<option'+(w.as===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div></div></div><div class="mf"><button class="btn bo" onclick="closeMs()">Cancel</button><button class="btn bp" onclick="saveWOComplete('+id+')" style="background:var(--gn)">Complete</button></div>')}
function saveWOComplete(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;var notes=$('c-text')&&$('c-text').value;var cost=$('c-cost')&&$('c-cost').value;w.actual_end=now().toISOString();w.actual_cost=cost?parseFloat(cost):null;w.st='done';w.cAt=now().toISOString();if(notes)w.updates.push({text:'✅ '+notes,by:$('c-by')?$('c-by').value:'',at:now().toISOString()});woA(w,'Completed',$('c-by')?$('c-by').value:'');
  if(w.srcTicket){var st=D.requests.find(function(r){return r.tn===w.srcTicket});if(st){var si=st.items.find(function(i){return i.id===w.srcItem&&i.st==='escalated'});if(si){si.st='done';si.cAt=now().toISOString();si.cS=Math.floor((now()-new Date(st.ca))/1000)}}}
  sv();closeMs();toast('Completed');R();openWODet(id)}

function saveEditWO(id){var w=D.workorders.find(function(x){return x.id===id});if(!w)return;w.area=$('ew-a').value;w.loc=$('ew-l').value;w.desc=$('ew-d').value;w.pri=$('ew-p').value;w.dept=$('ew-dp').value;var newAs=$('ew-as')&&$('ew-as').value||'';if(w.assign_type==='outsource')w.contractor=newAs;else w.as=newAs;w.requested_date=$('ew-rd').value;woA(w,'Edited','Maui A.');sv();closeMs();toast('Saved');R()}

function toggleCompCat(selId,val){var w=document.getElementById(selId+'-wrap');if(w){if(val.indexOf('10-28')===0)w.classList.remove('hid');else w.classList.add('hid')}}
